[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdwm"
version = "0.0.1"
description = "Auditable world-model experiments built on Stable World Model"
requires-python = ">=3.10"
dependencies = [
  "stable-worldmodel[all]==0.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

# Read-only dashboard; install this group alone in its own environment.
# Does not install or change the research/training dependencies.
[dependency-groups]
result-studio = [
  "streamlit==1.64.0",
  "numpy>=1.26,<3",
  "pandas>=2,<3",
  "plotly==6.9.0",
  "pillow==12.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the installed Stable World Model runtime",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
