schema_version: 1
id: actor_free_td_lewm_v1_c4_cube_v1
method: actor_free_td_lewm_v1_c4
method_family: actor_free_td_lewm_v1
variant: c4
display_name: Actor-Free TD-JEPA V1 C4 State-Only Frozen-F TD
implementation_version: v1
objective_version: 0
environment: cube
stage: full_training
initialization: frozen_pretrained_lewm_new_state_only_g

pretrained_world_model:
  source_method: lewm
  source_seed: 3072
  source_epoch: 10
  checkpoint_sha256: 198c468cadb63655066c968726cef69e36fe5682fcaec55620dd610a8b75e257
  frozen: true

runtime:
  stable_worldmodel_version: 0.1.1
  import: import stable_worldmodel as swm

seeds: [3072]

dataset:
  identifier: quentinll/lewm-cube
  file: ogbench/cube_single_expert.h5
  expected_size_bytes: 101942558720
  accepted_size_bytes: [101942558720, 74104077358]
  optimized_layout:
    file: cube_single_expert_chunk1.h5
    pixels_chunk_frames: 1
    lossless: true
    sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  lance:
    suffix: .lance
    manifest_suffix: .manifest.json
    stable_worldmodel_version: 0.1.1
    image_codec: jpeg
    jpeg_quality: 100
    minimum_pixel_verification_samples: 128
    numeric_verification:
      action: exact
      observation: float32_cast_exact
    source:
      file: cube_single_expert_chunk1.h5
      size_bytes: 74104077358
      sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  expected_episodes: 10000
  expected_transitions: 2010000
  keys_to_load: [action]
  keys_to_cache: []
  keys_to_merge: {}

split:
  unit: sequence_clip
  implementation: torch.utils.data.random_split
  train_fraction: 0.9
  validation_fraction: 0.1
  seed_source: training_seed
  exact_indices_artifact: split_indices.npz

sequence:
  frame_skip: 5
  history_frames: 3
  prediction_frames: 1
  num_steps: 19

context:
  g_state_frames: 1
  lewm_rollout_history_frames: 3

image_preprocessing:
  source: stable_pretraining.data.dataset_stats.ImageNet
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

normalization:
  fit_population: complete_dataset
  columns: [action, observation]
  boundary_nan_policy: preserve_then_zero_invalid_action_values_for_forward

model:
  parameters: 18034628
  encoder_size: tiny
  patch_size: 14
  embed_dim: 192
  predictor_depth: 6
  predictor_heads: 16
  predictor_mlp_dim: 2048
  predictor_dim_head: 64
  predictor_dropout: 0.1
  predictor_embedding_dropout: 0.0
  projector_hidden_dim: 2048

g:
  architecture: td_jepa_state_only_forward_map_v1_c4
  state_dim: 192
  task_dim: 192
  output_dim: 192
  hidden_dim: 256
  hidden_layers: 1
  embedding_layers: 2
  num_parallel: 1
  action_input: none
  action_effect: only_via_f_predicted_state
  goal_conditioning: task_input
  successor_semantics: includes_current_input_state
  actor: none
  reward: none
  gamma: 0.95
  target_ema_decay: 0.995

task_sampling:
  sampling: per_transition_bernoulli
  goal_probability: 0.5
  random_source: isotropic_gaussian_sphere
  goal_source: uniform_reachable_future_frozen_latent_same_clip
  normalization: sqrt_dim_l2_sphere
  mix_unit: transition_minibatch
  goal_sampling_seed_offset: 170003
  task_sampling_seed_offset: 270007

time_alignment:
  replay_anchor: z_i_minus_1
  real_online_input: real_z_i
  predicted_online_input: stop_gradient_f_of_z_i_minus_1_a_i_minus_1
  shared_target_current_feature: real_z_i
  shared_target_bootstrap_input: real_z_i_plus_1
  terminal_semantics: d_i_true_when_real_z_i_is_terminal
  terminal_target: y_i_equals_z_i
  f_history_states: 3
  f_output_gradient: stop_gradient

joint_objective:
  objective: equal_real_predicted_state_only_goal_projected_td
  vector_td_population: all_transitions_both_branches
  vector_reduction: mean_of_squared_l2_norm
  goal_subset: goal_derived_tasks_only
  goal_projection_weight: 1.0
  goal_projection_target: detached_shared_td_target_projection
  branch_combination: one_half_real_plus_predicted
  target_gradient: stop_gradient
  trainable_modules: [online_g_c4]
  frozen_modules:
    - lewm_observation_encoder
    - lewm_action_encoder
    - lewm_world_model_predictor_f
    - target_g_c4
  lewm_prediction_loss: none
  sigreg_loss: none

loader:
  batch_size: 256
  sampling_unit: transition
  transition_population: unique_legal_td_rows_from_exact_v1_c_clip_split
  train_sampling: random_with_replacement
  validation_sampling: sequential_without_replacement
  frozen_latent_mmap: true
  device_image_preprocessing: false
  workers: 6
  prefetch_factor: 2
  validation_workers: 2
  train_drop_last: true
  validation_drop_last: false
  pin_memory: true

logging:
  type: csv
  flush_every_n_steps: 50

optimizer:
  type: AdamW
  world_model_learning_rate: 0.0
  g_learning_rate: 0.0001
  weight_decay: 0.001

scheduler:
  type: linear_warmup_cosine_annealing
  interval: optimizer_step
  warmup_fraction: 0.01

training:
  epochs: 10
  scheduler_epochs: 10
  optimizer_steps_per_epoch: 12796
  precision: bf16-mixed
  model_compile: false
  model_compile_mode: reduce-overhead
  gradient_clip_norm: 1.0
  checkpoint_every_epochs: 1
  resume: true

provenance:
  comparison: actor_free_td_lewm_v1_c
  base_protocol: configs/experiment/actor_free_td_lewm_v1_c_cube_train.yaml
  status: implementation_ready_untrained
  note: C4 keeps E, EA, and F frozen and trains only a new state/task G on aligned real and stop-gradient F-predicted states.
