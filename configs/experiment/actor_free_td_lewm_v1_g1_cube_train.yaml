  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

normalization:
  fit_population: complete_dataset
  columns: [action, observation]
  boundary_nan_policy: preserve_then_zero_invalid_action_values_for_forward

model:
  parameters: 18034628
  encoder_size: tiny
  patch_size: 14
  embed_dim: 192
  predictor_depth: 6
  predictor_heads: 16
  predictor_mlp_dim: 2048
  predictor_dim_head: 64
  predictor_dropout: 0.1
  predictor_embedding_dropout: 0.0
  projector_hidden_dim: 2048

predictor:
  objective_version: 0
  architecture: td_jepa_forward_map_v1
  state_dim: 192
  raw_action_dim: 25
  action_dim: 192
  action_embedding_dim: 192
  task_dim: 192
  output_dim: 192
  hidden_dim: 256
  hidden_layers: 1
  embedding_layers: 2
  num_parallel: 1
  action_processing: frozen_shared_lewm_action_encoder
  shared_lewm_action_encoder: true
  action_encoder_trainable: false
  action_encoder_source: world_model.action_encoder
  state_parameterization: symmetric_shared_frozen_lewm_latent
  goal_conditioning: task_input
  bootstrap_action: dataset_next_action
  actor: none
  reward: none
  gamma: 0.95
  target_ema_decay: 0.995
  loss_warmup_fraction: 0.0

task_sampling:
  sampling: per_transition_bernoulli
  goal_probability: 0.5
  random_source: isotropic_gaussian_sphere
  goal_source: uniform_reachable_future_frozen_latent_same_clip
  normalization: sqrt_dim_l2_sphere
  mix_unit: transition_minibatch
  goal_sampling_seed_offset: 170003
  task_sampling_seed_offset: 270007

joint_objective:
  base_td_population: all_transitions
  random_task_weight: 1.0
  goal_subset: goal_derived_tasks_only
  final_weight_normalization: mean_one_over_all_transitions
  weight_gradient: stop_gradient
  candidate_td_targets: none
  objective: neighbor_action_advantage
  score_source: detached_online_predictor
  candidate_source: other_episode_frozen_latent_knn_real_action_blocks
  neighbor_temperature: 0.5
  neighbors_per_anchor: 8
  weight_temperature: 0.5
  goal_subset_weighting: softmax_mean_one

loader:
  batch_size: 256
  sampling_unit: transition
  transition_population: unique_legal_td_rows_from_exact_clip_split
  train_sampling: random_with_replacement
  validation_sampling: sequential_without_replacement
  frozen_latent_mmap: true
  device_image_preprocessing: false
  workers: 6
  prefetch_factor: 2
  validation_workers: 2
  train_drop_last: true
  validation_drop_last: false
  pin_memory: true

logging:
  type: csv
  flush_every_n_steps: 50

optimizer:
  type: AdamW
  world_model_learning_rate: 0.0
  predictor_learning_rate: 0.0001
  weight_decay: 0.001

scheduler:
  type: linear_warmup_cosine_annealing
  interval: optimizer_step
  warmup_fraction: 0.01

training:
  epochs: 10
  scheduler_epochs: 10
  optimizer_steps_per_epoch: 12796
  precision: bf16-mixed
  model_compile: false
  model_compile_mode: reduce-overhead
  gradient_clip_norm: 1.0
  checkpoint_every_epochs: 1
  resume: true

provenance:
  base_protocol: configs/experiment/lewm_cube_train.yaml
  predecessor: actor_free_td_lewm_g1
  status: implementation_ready_untrained
  note: V1 freezes LeWM and trains one symmetric single-head goal-conditioned TD-JEPA predictor from cached latents, frozen shared LeWM action embeddings, and dataset next actions.
