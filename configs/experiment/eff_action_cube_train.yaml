# First experiment. The previously open choices are settled by the user on
# 2026-09-12 and are recorded under locked_decisions below.
# Formal execution is enabled because protocol_status is user_locked.
schema_version: 1
method_family: eff_action
protocol_status: user_locked
runtime:
  stable_worldmodel_version: 0.1.1
pretrained_world_model:
  source_method: lewm
  source_seed: 3072
  source_epoch: 10
  checkpoint_sha256: 198c468cadb63655066c968726cef69e36fe5682fcaec55620dd610a8b75e257
  frozen: true
frozen_data:
  manifest_sha256: fc80bcc4187a7fd98ff7bbfcfa1d5a4c3a76b467af2f5f22fed601855c573c7e
  dataset_source_sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  column_normalization_sha256: 7fd14e6a72841a36abd8f1d4aedf4f17f4f71ca508cacefe331e989664954818
  total_rows: 2010000
  episodes: 10000
  extraction_precision: bfloat16
image_preprocessing:
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
sampling:
  gv: &sampling
    # User decision 2026-09-12: drop the RP1 0-7999 / 8000-9999 episode holdout
    # and train on the complete dataset, matching the project's own convention
    # (lewm_cube_train.yaml split.unit=sequence_clip: the released trainer's
    # clip-level 90/10 split leaves every one of the 10000 episodes partly in
    # train, so LeWM F and the C--G3 critic have both seen all 10000 episodes).
    # EffAction therefore trains on all episodes too, which removes the 80%
    # vs 100% exposure gap measured against C--G3 on the aligned pair lists.
    # Residual difference, disclosed: this sampler is episode-granular, so it
    # uses 100% of rows, whereas the inherited split uses 90% of clips.
    episode_start: 0
    episode_stop: 10000
    action_block_steps: 5
    grid_phase: 0
    min_goal_chunks: 1
    max_goal_chunks: 40
    goal_source: same_episode_future
    offset_distribution: uniform_offset_then_uniform_valid_start
    # Calibrated on 4096 read-only samples from episodes 0-7999, which was the
    # training range at calibration time. Episodes 8000-9999 are expert
    # trajectories from the same dataset, so the eta distribution is expected
    # to match; it has NOT been re-measured on the full 0-9999 range.
    # eta >= 0.3 keeps 17.7% of samples on the direct branch (0.9 kept 3.9%).
    efficiency_threshold: 0.3
    efficiency_epsilon: 0.000001
    direct_max_chunks: null
    zero_distance_policy: exclude
    zero_distance_tolerance: 0.00000001
  planner:
    <<: *sampling
    max_goal_chunks: 10
    # Same calibration on the planner sampler (offsets 1-10 chunks):
    # eta >= 0.8 keeps 22.9% of samples on the direct branch (0.9 kept 15.6%).
    efficiency_threshold: 0.8
loader:
  batch_size: 256
validation:
  # Monitoring subset only. checkpoint_selection is fixed_budget_no_test_-
  # selection, so this range never picks a checkpoint. After the move to
  # full-dataset training it is no longer a held-out set; it is retained so
  # the validation curves stay comparable with the earlier smoke runs.
  episode_start: 8000
  episode_stop: 10000
  seed: 50
  batches: 16
  checkpoint_selection: fixed_budget_no_test_selection
training:
  seed: 3072
  precision: bfloat16
  g:
    hidden_dim: 256
    hidden_layers: 1
    embedding_layers: 2
  v:
    hidden_dim: 256
    hidden_layers: 2
    output_activation: softplus
  planner:
    raw_action_dim: 25
    hidden_dim: 512
    hidden_layers: 2
    iterations: 8
    epsilon: 0.000001
    initialization:
      distribution: zeros
    # Read-only audit of all finite training action blocks (episodes 0-7999):
    # global max |a| = 3.4928, per-coordinate max = [3.4928, 2.5479, 1.5590,
    # 2.5469, 3.1814] repeated over the five primitive steps. The previous
    # RP1-derived 1.6 clipped 8.77% of coordinates and 49.2% of blocks, which
    # made the stage-1 reconstruction target unreachable. 3.5 clips 0%.
    lower_bound: -3.5
    upper_bound: 3.5
    lambda_traj: 1.0
    lambda_eff: 0.1
  gv:
    steps: 127960
    g_optimizer: &optimizer
      lr: 0.0001
      weight_decay: 0.001
      betas: [0.9, 0.999]
      eps: 0.00000001
    v_optimizer:
      <<: *optimizer
    warmup_steps: 1280
    min_lr_ratio: 0.0
    gradient_clip_norm: 1.0
    ema_decay: 0.995
  stage1:
    steps: 6000
    optimizer:
      <<: *optimizer
    warmup_steps: 60
    min_lr_ratio: 0.0
    gradient_clip_norm: 1.0
  stage2:
    steps: 6000
    optimizer:
      <<: *optimizer
    optimizer_transition: carry
    warmup_steps: 60
    min_lr_ratio: 0.0
    gradient_clip_norm: 1.0
logging:
  metrics_every_steps: 50
  checkpoint_every_steps: 12796
locked_decisions:
  action_object: Single five-step block (25-D), replanned every five primitive steps.
  cross_episode_goals: Excluded from the first version; sampler only draws same-episode future goals.
  efficiency_threshold: gv 0.3, planner 0.8; calibrated on read-only samples, see sampling comments.
  architectures: G = 1x256 (+2 embedding layers), V = 2x256 with softplus, P = 2x512.
  planner_iterations: K = 8, epsilon = 1e-6, lambda_traj = 1.0, lambda_eff = 0.1.
  budgets: G/V 127960 updates, planner stage1 6000, stage2 6000, training seed 3072.
  initialization: zeros reference action, normalized bounds [-3.5, 3.5]; see planner comments.
  data_note: >-
    The frozen cache pads the tail of every episode with non-finite action
    blocks (40000 of 1608000 training rows, 2.5%). The sampler validates and
    excludes them; they must never reach a loss or an evaluation.
