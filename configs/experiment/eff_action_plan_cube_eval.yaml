# Confirmed evaluation protocol; still requires a formally trained checkpoint.
method: EffActionPlan
schema_version: 1
protocol_status: user_locked
runtime:
  stable_worldmodel_version: 0.1.1
  precision: fp32
  renderer: egl
dataset:
  format: lance
  manifest_sha256: 9de531030c6bca21a7b3215d7abea3aaf277e68a1e4cec03c8c6e22ad0d20dcd
  source_sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
image_preprocessing:
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
world:
  env_name: swm/OGBCube-v0
  env_type: single
  ob_type: states
  image_size: 224
  multiview: false
  visualize_info: false
  terminate_at_goal: true
selection:
  # User decision 2026-09-12: evaluate on the same fixed pair lists as the
  # C--G3 baseline so both methods are scored on identical tasks.
  # historical_cg3 is locked to 50 pairs / seed 42 and reproduces the C--G3
  # selection_sha256 per offset (25/50/100) under an exact hash lock; it was
  # verified to regenerate all three locked digests before this edit.
  # Caveat: these lists draw from all 10000 episodes, about 40 of 50 pairs
  # come from the training region 0-7999, so absolute success rates are
  # optimistic. Only the EffAction-vs-C--G3 delta on identical pairs is a
  # controlled comparison; treat the absolute numbers as train-region scores.
  protocol: historical_cg3
  goal_offset: 25
  episodes: 50
  seed: 42
epsilon: 0.000001
planning:
  horizon: 1
  receding_horizon: 1
  action_block: 5
  history_len: 1
  warm_start: false
  planning_seed: 42
  episode_budget: 50
  iterations: 8
  initialization: zeros
  initial_std: 0.0
  # Matches the locked training bounds; 1.6 clipped 49.2% of real action blocks.
  lower_bound: -3.5
  upper_bound: 3.5
