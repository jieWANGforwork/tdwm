schema_version: 1
id: lewm_cube_seed3072_epoch10_o100_full_plan
method: lewm
environment: cube

runtime:
  stable_worldmodel_version: 0.1.1
  import: import stable_worldmodel as swm
  precision: fp32

image_preprocessing:
  source: stable_pretraining.data.dataset_stats.ImageNet
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

dataset:
  identifier: quentinll/lewm-cube
  format: lance
  expected_episodes: 10000
  expected_transitions: 2010000
  episode_steps: 201
  lance:
    manifest_suffix: .manifest.json
    image_codec: jpeg
    jpeg_quality: 100
  keys_to_load:
    - pixels
    - action
    - qpos
    - qvel
    - privileged_block_0_pos
    - privileged_block_0_quat
  evaluation_split:
    population: all valid start rows across all 10000 dataset episodes
    sampler: stable-worldmodel-0.1.1-valid-row-sampler
    replacement: false

checkpoint:
  source: local_lewm_training_export
  training_protocol: lewm_cube_train.yaml
  seed: 3072
  epoch: 10
  parameters: 18034628

world:
  env_name: swm/OGBCube-v0
  env_type: single
  ob_type: states
  image_size: 224
  multiview: false
  visualize_info: false
  terminate_at_goal: true
  success_threshold_meters: 0.04
  success_definition: target cube center is within 0.04 m of the target position

evaluation:
  episodes: 50
  goal_offset: 100
  start_goal_source: same dataset episode

context:
  training_history_frames: 3
  predictor_recurrent_window: 3
  plan_config_history_len: 1
  effective_observed_frames_at_first_plan: 1
  note: stable-worldmodel 0.1.1 WorldModelPolicy does not consume PlanConfig.history_len; the released evaluator uses its default value 1.

planning:
  solver: CEM
  horizon: 5
  candidates: 300
  iterations: 30
  elites: 30
  initial_variance: 1.0
  action_block: 5
  frame_skip: 5
  receding_horizon: 5
  executed_environment_steps_before_replanning: 25
  episode_budget: 200
  planning_seed: 42
  solver_batch_size: 1
  warm_start: true

provenance:
  base_protocol: configs/experiment/lewm_cube_seed3072_o50.yaml
  comparison_protocol: configs/experiment/actor_free_td_lewm_v1_c_cube_checkpoint_o100.yaml
  status: full_plan_revalidation_config_only
  note: Independent O100 baseline settings for the full-plan revalidation entry point. Uses the existing local dataset population and sampler, not the RP1 held-out split. No training or historical result is changed.
